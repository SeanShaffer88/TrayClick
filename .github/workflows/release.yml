name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Package portable exe + installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/trayclick.exe "dist/TrayClick-$tag-portable.exe"
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$ver" "/DTagName=$tag" installer/TrayClick.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Select-Object Name, Length
      - name: Bundle release zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $setup = Get-ChildItem "dist/TrayClick-Setup-*.exe" | Select-Object -First 1
          $port = Get-ChildItem "dist/TrayClick-*-portable.exe" | Select-Object -First 1
          $sum = @()
          foreach ($f in @($setup, $port)) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $sum += "$h  $($f.Name)"
          }
          $sum | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Compress-Archive -Path $setup.FullName, $port.FullName, "dist/SHA256SUMS.txt" -DestinationPath "dist/TrayClick-$tag.zip"
          Get-ChildItem dist | Select-Object Name, Length
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TrayClick-*-portable.exe
            dist/TrayClick-Setup-*.exe
            dist/TrayClick-*.zip
