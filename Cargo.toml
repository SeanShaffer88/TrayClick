[package]
name = "trayclick"
version = "0.2.0"
edition = "2021"
description = "A tiny Windows tray auto clicker: one keybind toggles left-clicking at the cursor at a set interval (1 ms, 100 ms, or custom)."
license = "MIT"
authors = ["Sean Shaffer"]

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
