[package]
name = "trayclick"
version = "0.7.0"
edition = "2021"
description = "A tiny Windows tray auto clicker: one keybind toggles clicking — or holding — any mouse button at the cursor or a locked spot, at a set interval with optional jitter and an auto-stop limit."
license = "MIT"
authors = ["Sean Shaffer"]

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
# Size-tuned release build (the workload is FFI-bound — SendInput and
# sleeps — so optimizing for size costs no measurable performance):
# LTO + one codegen unit for cross-crate optimization, symbols stripped,
# and panic=abort (there are no reachable panics by design; a window proc
# must never unwind across the FFI boundary anyway).
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
